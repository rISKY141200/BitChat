name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q BtChat.zip -d project
      - name: Build
        run: |
          S=$(find project -name 'settings.gradle*' | head -1)
          echo "Project di: $S"
          cd "$(dirname "$S")"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: BtChat-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
